server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Re-resolve the php upstream via Docker DNS so nginx survives the php
    # container being recreated with a new IP (e.g. by Watchtower).
    resolver 127.0.0.11 valid=10s;

    # Backend API — handed straight to php-fpm; Symfony routes on REQUEST_URI.
    location /api {
        include fastcgi_params;
        set $phpupstream php:9000;
        fastcgi_pass $phpupstream;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
    }

    # The update check and service worker must never be served stale.
    location = /version.json {
        add_header Cache-Control "no-store";
    }
    location = /sw.js {
        add_header Cache-Control "no-store";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed build artifacts are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback for client-side routes.
    location / {
        try_files $uri /index.html;
    }
}

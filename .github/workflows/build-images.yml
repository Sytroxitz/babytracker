name: Build & push images

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: babytracker-php
            dockerfile: docker/php/Dockerfile.prod
          - image: babytracker-web
            dockerfile: docker/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build number is the commit count.
          fetch-depth: 0

      - name: Derive version info
        id: version
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cs)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ steps.version.outputs.owner }}/${{ matrix.image }}:${{ steps.version.outputs.sha }}
          build-args: |
            BUILD_NUMBER=${{ steps.version.outputs.build }}
            GIT_SHA=${{ steps.version.outputs.sha }}
            GIT_DATE=${{ steps.version.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

# Production template. On the server:
#   1. copy this file as docker-compose.yml into an empty directory
#   2. copy .env.prod.example next to it as .env and fill in real values
#   3. docker compose up -d
# Watchtower picks up new :latest images pushed by the GitHub Actions workflow.
# TLS is expected to be terminated by a reverse proxy in front of ${HTTP_PORT}.

services:
  php:
    image: ghcr.io/${GHCR_OWNER}/babytracker-php:latest
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "mysql://${MYSQL_USER:-babytracker}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-babytracker}?serverVersion=8.0&charset=utf8mb4"
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      DEFAULT_URI: ${APP_URL:-http://localhost}
    volumes:
      # Keypair is generated by the entrypoint on first start and must survive updates,
      # otherwise every login token becomes invalid after each deploy.
      - jwt_keys:/app/config/jwt
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  web:
    image: ghcr.io/${GHCR_OWNER}/babytracker-web:latest
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - php
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-babytracker}
      MYSQL_USER: ${MYSQL_USER:-babytracker}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    labels:
      # The database is not ours to auto-update.
      - com.centurylinklabs.watchtower.enable=false

volumes:
  dbdata:
  jwt_keys:
